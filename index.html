    <!-- Static structured data for crawlers without JS. The SPA useSEO hook
         keeps an identical @graph in sync during client-side navigation. -->
    <script type="application/ld+json" id="ldoc-structured-data">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "LWrite",
            "url": "https://lwrite.app/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Rich Text Editor",
            "operatingSystem": "Web browser",
            "browserRequirements": "Requires JavaScript. Requires HTML5.",
            "description": "Free private online rich text editor in your browser. Write, format & export DOCX, PDF, ODT — no sign-up, with autosave and version history.",

            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": "Rich text editing, autosave, version history, document library, DOCX/PDF/ODT/RTF/HTML/TXT export, offline-first local storage",
            "inLanguage": ["en", "de", "es", "fr", "it", "pt", "nl", "ja", "zh", "ar", "ru"]
          },
          {
            "@type": "WebSite",
            "name": "LWrite",
            "url": "https://lwrite.app/",
            "inLanguage": ["en", "de"]
