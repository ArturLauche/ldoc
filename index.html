<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- route-head:start -->
    <title>LWrite – Private rich text editor</title>
    <meta
      name="description"
      content="Write and export documents in your browser, with local autosave and version history."
    />
    <!-- route-head:end -->
    <meta name="application-name" content="LWrite" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d212b" />
    <!-- Applies the saved theme before first paint (see src/lib/theme.ts). Runs
         before the app bundle, so it reads the preference directly. -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = window.localStorage.getItem('theme');
        } catch (error) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', dark ? '#1d212b' : '#ffffff');
        });
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LWrite" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Self-hosted interface fonts (no third-party requests). See public/fonts/. -->
    <link
      rel="preload"
      href="/fonts/files/dm-sans-400-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/dm-sans.css" />
    <link rel="stylesheet" href="/fonts/crimson-pro.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <!-- route-body:start -->
    <div id="root"></div>
    <noscript
      ><main>
        <h1>LWrite</h1>
        <p>Enable JavaScript to use the editor. Documents stay in your browser.</p>
      </main></noscript
    >
    <!-- route-body:end -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
